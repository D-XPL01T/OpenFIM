[workspace]
members = [
    "crates/openfim-common",
    "crates/openfim-agent",
    "crates/openfim-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["OpenFIM Security Architecture Team"]
license = "Apache-2.0"

[workspace.dependencies]
sha2 = "0.10.8"
blake3 = "1.5.5"
serde = { version = "1.0.218", features = ["derive"] }
serde_json = "1.0.139"
serde_yaml = "0.9.34"
thiserror = "2.0.11"
clap = { version = "4.5.31", features = ["derive", "env"] }
tokio = { version = "1.43.0", features = ["full"] }
rusqlite = { version = "0.33.0", features = ["bundled"] }
ed25519-dalek = { version = "2.1.1", features = ["rand_core"] }
rand_core = { version = "0.6.4", features = ["std", "getrandom"] }
cfg-if = "1.0.0"
hex = "0.4.3"
tempfile = "3.17.1"
glob = "0.3.2"
