[workspace]
members = [
    "crates/openfim-common",
    "crates/openfim-agent",
    "crates/openfim-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
# Minimum supported Rust version, enforced by a dedicated CI job.
#
# The floor is set by the dependency tree rather than by this crate's own code:
# `clap_lex` is published with edition2024, which requires a Cargo that can parse it,
# and edition2024 stabilized in 1.85. Attempting the build on 1.82 fails at the
# download step with "requires the Cargo feature called `edition2024`".
rust-version = "1.85"
authors = ["OpenFIM Security Architecture Team"]
license = "Apache-2.0"

[workspace.dependencies]
sha2 = "0.10.8"
blake3 = "1.5.5"
serde = { version = "1.0.218", features = ["derive"] }
serde_json = "1.0.139"
serde_yaml = "0.9.34"
thiserror = "2.0.11"
clap = { version = "4.5.31", features = ["derive", "env"] }
tokio = { version = "1.43.0", features = ["full"] }
rusqlite = { version = "0.33.0", features = ["bundled"] }
ed25519-dalek = { version = "2.1.1", features = ["rand_core"] }
rand_core = { version = "0.6.4", features = ["std", "getrandom"] }
cfg-if = "1.0.0"
hex = "0.4.3"
tempfile = "3.17.1"
glob = "0.3.2"
# Structured logging for the daemon. The agent is a long-running service whose output
# must be machine-ingestible; the interactive CLI and console stay on println! because
# their output is a user interface, not a log stream.
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "json"] }
